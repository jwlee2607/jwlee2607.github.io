<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="이지원의 개인 홈페이지" />
    <title>이지원 | 개인 홈페이지</title>
    <style>
      :root { --canvas: #f6f5f4; --surface: #fff; --ink: #000; --muted: #615d59; --line: #e6e6e6; --blue: #0075de; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; background: var(--canvas); }
      main { width: min(100% - 40px, 880px); margin: 0 auto; padding: clamp(48px, 10vw, 112px) 0 48px; }
      .intro { position: relative; overflow: hidden; padding: clamp(32px, 7vw, 64px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      .intro::after { position: absolute; top: -58px; right: -58px; width: 160px; height: 160px; border-radius: 50%; background: #d6b6f6; content: ""; opacity: .62; }
      .profile-photo { position: relative; z-index: 1; display: block; width: 128px; aspect-ratio: 1; margin: 0 0 28px; border: 1px solid var(--line); border-radius: 16px; object-fit: cover; }
      .label { position: relative; z-index: 1; display: inline-block; margin: 0 0 20px; padding: 5px 10px; border-radius: 9999px; color: var(--blue); font-size: .75rem; font-weight: 700; letter-spacing: .04em; background: #fff; border: 1px solid var(--line); }
      h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 700; letter-spacing: -.065em; line-height: 1; }
      .greeting { position: relative; z-index: 1; max-width: 34rem; margin: 24px 0 0; color: var(--muted); font-size: clamp(1rem, 2.8vw, 1.15rem); line-height: 1.7; }
      .details { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 44px 0 0; }
      .card { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      .card h2 { margin: 0 0 10px; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .03em; }
      .card p { margin: 0; font-size: 1.08rem; font-weight: 600; line-height: 1.45; }
      footer { margin-top: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
      @media (max-width: 520px) { main { width: min(100% - 28px, 880px); padding-top: 36px; } .intro { padding: 32px 24px; } .intro::after { width: 110px; height: 110px; } .profile-photo { width: 104px; } .details { grid-template-columns: 1fr; margin-top: 32px; } }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="name">
        <img class="profile-photo" src="assets/photo.jpg" alt="이지원의 프로필 사진" />
        <p class="label">PERSONAL WEBSITE</p>
        <h1 id="name">이지원</h1>
        <p class="greeting">안녕하세요! 저의 작은 공간에 방문해 주셔서 반가워요.</p>
        <div class="details">
          <article class="card"><h2>소개</h2><p>첨단융합학부 26학번 · 07년생</p></article>
          <article class="card"><h2>좋아하는 것</h2><p>음악 🎵</p></article>
        </div>
      </section>
      <footer>© 2026 이지원</footer>
    </main>
  </body>
</html>
